<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revit Health Studio</title>
<style>
:root{--bg:#f5f2ee;--paper:#fff;--ink:#37322b;--muted:#716b63;--line:#ddd6ce;--accent:#6f6044;--pass:#367b55;--fail:#ba4941}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'Segoe UI',Arial,sans-serif}header{border-bottom:1px solid var(--line);padding:18px 4vw;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:700}main{max-width:1440px;margin:auto;padding:32px 4vw}h1{font-size:32px;margin:8px 0}h2{font-size:20px}p{line-height:1.6}.muted{color:var(--muted)}button,.fileLabel{border:1px solid var(--line);border-radius:8px;padding:10px 16px;background:#fff;color:var(--ink);cursor:pointer;font:inherit}.primary{background:var(--accent);color:#fff}button:hover,.fileLabel:hover{filter:brightness(.95)}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;margin:26px 0}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px}.health{display:flex;align-items:center;gap:24px}.ring{width:145px;height:145px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pass) calc(var(--score)*1%),#eee8e1 0)}.ring>strong{display:grid;place-items:center;width:115px;height:115px;border-radius:50%;background:#fff;font-size:30px}.stats{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0}.stats b{font-size:22px;display:block}.pass{color:var(--pass)}.fail,.error{color:var(--fail)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:16px}.group{padding:20px;text-align:left;width:100%;background:#fff;border-radius:16px}.group h3{margin:0 0 16px}.group .pct{font-size:30px;font-weight:600}.bar{height:7px;background:#eee8e1;border-radius:5px;margin:12px 0;overflow:hidden}.bar>span{display:block;height:100%;background:var(--accent)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:22px 0}input,select{padding:10px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff}input[type=search]{flex:1;min-width:220px}.check{background:#fff;border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}.check>summary{cursor:pointer;padding:18px;display:flex;gap:14px;align-items:center}.check>summary h3{margin:0;font-size:15px;flex:1}.badge{border-radius:20px;padding:5px 10px;background:#f0ebe5;font-size:12px;white-space:nowrap}.badge.pass{background:#e7f2eb}.badge.fail,.badge.error{background:#fbece9}.body{padding:0 18px 18px}.tablewrap{overflow:auto;max-height:480px;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#eee8e1;position:sticky;top:0}td{word-break:break-word}tbody tr:hover{background:#faf8f5}.message{margin:14px 0;padding:10px;background:#f9f6f2;border-radius:7px}#preview{width:100%;max-height:280px;object-fit:contain;background:#fff;cursor:ew-resize;touch-action:none}#previewPanel{display:flex;flex-direction:column;justify-content:center}#feedback{font-size:12px;color:var(--muted)}dialog{width:min(1100px,94vw);max-height:90vh;border:1px solid var(--line);border-radius:16px;padding:24px;background:var(--bg);color:var(--ink)}dialog::backdrop{background:#37322b99}.modalHead{display:flex;justify-content:space-between;align-items:center;gap:16px}.overview{margin:22px 0}.overviewRow{display:grid;grid-template-columns:230px 1fr 65px;gap:14px;align-items:center}.overviewRow .bar{margin:8px 0}footer{padding:24px 4vw;color:var(--muted);border-top:1px solid var(--line)}@media(max-width:750px){.hero{grid-template-columns:1fr}.health{gap:16px}.ring{width:110px;height:110px}.ring>strong{width:86px;height:86px;font-size:23px}.overviewRow{grid-template-columns:150px 1fr 55px}.check>summary{flex-wrap:wrap}main{padding:20px}}@media print{header button,header label,.toolbar,#download,dialog,.copy{display:none}.hero{grid-template-columns:1fr 1fr}.check{break-inside:avoid}details>div{display:block!important}body{background:#fff}.tablewrap{max-height:none;overflow:visible}.cards{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><div class="brand">MEP / REVIT HEALTH STUDIO</div><div><label class="fileLabel">Mở JSON<input id="file" type="file" accept=".json,application/json" hidden></label> <button id="download">Tải JSON</button> <button id="print">In / PDF</button></div></header>
<main><div class="brand">MODEL HEALTH REPORT</div><h1 id="title"></h1><p id="meta" class="muted"></p>
<div class="hero"><section class="panel"><div class="health"><div id="ring" class="ring"><strong id="score"></strong></div><div><h2>Tỷ lệ đạt</h2><div id="counts" class="stats"></div></div></div><p id="scoreNote" class="muted"></p><div id="extras" class="muted"></div></section>
<section id="previewPanel" class="panel"><h2>Góc nhìn mô hình</h2><img id="preview" alt="Ảnh chụp mô hình Revit"><p id="previewHint" class="muted"></p></section></div>
<section><h2>Tổng quan nhóm kiểm tra</h2><div id="cards" class="cards"></div><div id="overview" class="panel overview"></div></section>
<section><div class="toolbar"><h2>Chi tiết kiểm tra</h2><input id="search" type="search" placeholder="Tìm hạng mục, tên phần tử hoặc Element ID"><select id="group"><option value="">Tất cả nhóm</option></select><select id="status"><option value="">Tất cả trạng thái</option><option value="fail">Không đạt</option><option value="review">Cần rà soát</option><option value="pass">Đạt</option><option value="error">Lỗi kiểm tra</option><option value="notConfigured">Chưa cấu hình</option><option value="notApplicable">Không áp dụng</option></select></div><p id="feedback" role="status"></p><div id="checks"></div></section>
</main><footer>Điểm được tính theo quy tắc đã chọn và tiêu chuẩn đi kèm. Các kiểm tra MEP và danh mục rà soát bổ sung không nằm trong điểm tiêu chuẩn. Báo cáo xử lý cục bộ trong trình duyệt.</footer>
<dialog id="modal"><div class="modalHead"><h2 id="modalTitle"></h2><button id="closeModal">Đóng</button></div><p id="modalStats" class="muted"></p><div id="modalChecks"></div></dialog>
<script type="application/json" id="report">__REPORT_JSON__</script>
<script>
'use strict';
const $=id=>document.getElementById(id),labels={pass:'Đạt',fail:'Không đạt',review:'Cần rà soát',error:'Lỗi kiểm tra',notConfigured:'Chưa cấu hình',notApplicable:'Không áp dụng'};
let report,frames=[];
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
function percentage(value){return typeof value==='number'?value.toLocaleString('vi-VN',{maximumFractionDigits:1})+'%':'—';}
async function copy(text){try{await navigator.clipboard.writeText(text);$('feedback').textContent='Đã sao chép: '+text;}catch(_){window.prompt('Sao chép Element ID:',text);}}
function validate(data){if(!data||!['1.0','1.1'].includes(data.schemaVersion)||!Array.isArray(data.checks)||!data.project||!data.summary)throw Error('JSON không phải báo cáo Revit Health Studio được hỗ trợ.');if(data.checks.some(c=>!c||!Array.isArray(c.findings)))throw Error('checks/findings không hợp lệ.');return data;}
function groups(data){const map=new Map();for(const c of data.checks){const key=c.category||'General';if(!map.has(key))map.set(key,{name:key,total:0,passed:0,failed:0,review:0,errors:0,notConfigured:0,notApplicable:0,scoredPass:0,scoredTotal:0});const g=map.get(key);g.total++;const keys={pass:'passed',fail:'failed',review:'review',error:'errors',notConfigured:'notConfigured',notApplicable:'notApplicable'};if(keys[c.status])g[keys[c.status]]++;if(c.isScored&&(c.status==='pass'||c.status==='fail')){g.scoredTotal++;if(c.status==='pass')g.scoredPass++;}}return [...map.values()].map(g=>({...g,healthPercent:g.scoredTotal?Math.round(g.scoredPass/g.scoredTotal*1000)/10:null}));}
function buildCheck(c){const item=node('details',undefined,'check');const head=node('summary');head.append(node('h3',c.title||c.id));head.append(node('span',labels[c.status]||c.status,'badge '+c.status));head.append(node('span',String(c.count??0)+' phát hiện','muted'));item.append(head);const body=node('div',undefined,'body');body.append(node('p',c.id+' · '+(c.recommendation||''),'muted'));if(c.error)body.append(node('p',c.error,'error'));const ids=[...new Set(c.findings.flatMap(f=>f.elementIds||[]))];if(ids.length){const button=node('button','Sao chép tất cả ID','copy');button.addEventListener('click',()=>copy(ids.join(', ')));body.append(button);}
for(const f of c.findings){body.append(node('div',f.message||'','message'));if(f.failureDefinitionId)body.append(node('p','Failure ID: '+f.failureDefinitionId,'muted'));let rows=f.elements||[];if(!rows.length)rows=(f.elementIds||[]).map(id=>({id,name:'',category:'',type:''}));if(!rows.length)continue;const wrap=node('div',undefined,'tablewrap'),table=node('table'),thead=node('thead'),tr=node('tr');for(const label of ['ID','Name','Category','Type'])tr.append(node('th',label));thead.append(tr);table.append(thead);const tbody=node('tbody');for(const e of rows){const row=node('tr'),id=node('td');if(e.id!==null&&e.id!==undefined){if(e.category==='Workset')id.append(node('span',String(e.id)));else{const btn=node('button',String(e.id),'copy');btn.addEventListener('click',()=>copy(String(e.id)));id.append(btn);}}else id.textContent='N/A';row.append(id,node('td',e.name||''),node('td',e.category||''),node('td',e.type||''));tbody.append(row);}table.append(tbody);wrap.append(table);body.append(wrap);}item.append(body);return item;}
function detailList(container,checks){container.replaceChildren();for(const c of checks)container.append(buildCheck(c));if(!checks.length)container.append(node('p','Không có kết quả phù hợp.','muted'));}
function filter(){const text=$('search').value.toLocaleLowerCase(),group=$('group').value,status=$('status').value;detailList($('checks'),report.checks.filter(c=>(!group||(c.category||'General')===group)&&(!status||c.status===status)&&(!text||JSON.stringify([c.id,c.title,c.category,c.findings]).toLocaleLowerCase().includes(text))));}
function render(data){report=validate(data);const gs=groups(report),assessed=report.checks.filter(c=>c.isScored&&(c.status==='pass'||c.status==='fail')),score=assessed.length?Math.round(assessed.filter(c=>c.status==='pass').length/assessed.length*1000)/10:null;$('title').textContent=report.project.title||'Revit Project';$('meta').textContent='Revit '+(report.project.revitVersion||'')+' · '+new Date(report.generatedAtUtc).toLocaleString('vi-VN')+' · '+(report.ruleProfile?.name||'Không có profile');$('score').textContent=percentage(score);$('ring').style.setProperty('--score',score||0);$('counts').replaceChildren();for(const [label,key,cls] of [['Đạt','passed','pass'],['Không đạt','failed','fail'],['Tổng mục','total','']]){const block=node('div');block.append(node('b',String(report.summary[key]||0),cls),node('span',label,'muted'));$('counts').append(block);}$('scoreNote').textContent='Số kiểm tra tính điểm: '+assessed.length+'. Tỷ lệ = số đạt / (đạt + không đạt). Chưa cấu hình, không áp dụng và lỗi kiểm tra được loại khỏi mẫu số.';$('extras').textContent=(report.summary.notConfigured||0)+' chưa cấu hình · '+(report.summary.errors||0)+' lỗi · '+(report.summary.notApplicable||0)+' không áp dụng · '+(report.summary.review||0)+' cần rà soát'+(report.summary.isComplete===false?' · Kết quả chưa đầy đủ.':'');$('cards').replaceChildren();$('overview').replaceChildren();$('group').replaceChildren(node('option','Tất cả nhóm'));$('group').firstChild.value='';
for(const g of gs){const button=node('button',undefined,'group');button.append(node('h3',g.name),node('div',percentage(g.healthPercent),'pct'));const bar=node('div',undefined,'bar'),fill=node('span');fill.style.width=(g.healthPercent||0)+'%';bar.append(fill);button.append(bar,node('p',g.total+' mục · '+g.passed+' đạt · '+g.failed+' không đạt','muted'),node('small',g.notConfigured+' chưa cấu hình · '+g.errors+' lỗi','muted'));button.addEventListener('click',()=>{$('modalTitle').textContent=g.name+' · '+percentage(g.healthPercent);$('modalStats').textContent=g.total+' mục · '+g.passed+' đạt · '+g.failed+' không đạt · '+g.notConfigured+' chưa cấu hình';detailList($('modalChecks'),report.checks.filter(c=>(c.category||'General')===g.name));$('modal').showModal();});$('cards').append(button);const opt=node('option',g.name);opt.value=g.name;$('group').append(opt);const row=node('div',undefined,'overviewRow'),b=node('div',undefined,'bar'),f=node('span');f.style.width=(g.healthPercent||0)+'%';b.append(f);row.append(node('span',g.name),b,node('strong',percentage(g.healthPercent)));$('overview').append(row);}
frames=(report.modelPreview?.frames||[]).filter(f=>typeof f==='string'&&/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(f));$('preview').hidden=!frames.length;if(frames.length)$('preview').src=frames[0];else $('preview').removeAttribute('src');$('previewHint').textContent=frames.length?'Di chuyển chuột hoặc kéo ngang để xem '+frames.length+' góc nhìn. Đây là ảnh chụp xoay, không phải mô hình 3D tương tác.':report.modelPreview?.error||'Chưa chụp ảnh. Trong tool Revit, mở view 3D và chọn “Chụp 16 góc nhìn”.';$('search').value='';$('status').value='';filter();}
$('preview').addEventListener('pointermove',e=>{if(!frames.length)return;const box=e.currentTarget.getBoundingClientRect();const index=Math.min(frames.length-1,Math.max(0,Math.floor((e.clientX-box.left)/box.width*frames.length)));e.currentTarget.src=frames[index];});$('preview').addEventListener('pointerdown',e=>{e.preventDefault();e.currentTarget.setPointerCapture(e.pointerId);});$('search').addEventListener('input',filter);$('group').addEventListener('change',filter);$('status').addEventListener('change',filter);$('closeModal').addEventListener('click',()=>$('modal').close());$('print').addEventListener('click',()=>{const closed=[...document.querySelectorAll('#checks details:not([open])')];closed.forEach(d=>d.open=true);window.print();closed.forEach(d=>d.open=false);});$('download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),a=node('a');a.href=url;a.download='revit-health-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});$('file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{render(JSON.parse(await file.text()));$('feedback').textContent='Đã mở '+file.name;}catch(error){$('feedback').textContent=error.message;}});
try{render(JSON.parse($('report').textContent));}catch(error){$('title').textContent='Không thể đọc báo cáo';$('feedback').textContent=error.message;}
</script></body></html>
